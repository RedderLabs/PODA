name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm test
      - run: pnpm typecheck
      - name: Guardar la web compilada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/out
          retention-days: 1

  # Solo despliega lo que ha pasado las pruebas, y solo desde main.
  publicar:
    needs: compilar-y-probar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://podamovil.com
    concurrency:
      group: publicar
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: out
      - name: Comprobar credenciales de Cloudflare
        id: credenciales
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CUENTA" ]; then
            echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: no se publica (ver docs/desarrollo.md)."
            echo "listas=no" >> "$GITHUB_OUTPUT"
          else
            echo "listas=si" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar en Cloudflare Pages
        if: steps.credenciales.outputs.listas == 'si'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=podamovil --branch=main --commit-dirty=true
